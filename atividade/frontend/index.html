<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Justin Bieber</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="container">

        <h1> Veja: Álbuns e Músicas de sucesso do Justin Bieber</h1>
        <p class="subtitle">Conhecendo mais sobre o cantor e suas músicas</p>

        <div class="albuns-area">
            <img src="" alt="Álbuns" id="albunsImage">
            <div id="breedName"></div>
        </div>

        <div class="controls">
            <button id="randomBtn">🎶 Clique e veja algumas de suas músicas</button>
        </div>

        <div class="search">
            <input
                type="text"
                id="breedInput"
                placeholder="Digite um Álbum: (ex: Purpose, Journals...)"
            >
            <button id="searchBtn">🔍 Buscar</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
